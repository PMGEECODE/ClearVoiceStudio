# electron-builder.yml
# ClearVoice Studio — desktop packaging configuration

appId: tech.livecodetech.clearvoice-studio
productName: "ClearVoice Studio"
copyright: "Copyright © 2024-2026 LiveCodeTech"
asar: false

# Directories
directories:
  output: dist-electron
  buildResources: build-resources

# Files to include in the packaged app.
files:
  - electron/**/*
  - .next/**/*
  - public/**/*
  - node_modules/**/*
  - package.json
  - next.config.ts
  - tsconfig.json
  - "!node_modules/electron/dist/**"
  - "!node_modules/.cache/**"
  - "!**/*.map"

# Extra resources: bundle Piper TTS models + runtime
extraResources:
  - from: piper-tts
    to: piper-tts
    filter:
      - "**/*.onnx"
      - "**/*.onnx.json"
      - "**/*.txt"
      - ".venv/**/*"

# Auto-update publish provider (GitHub Releases)
publish:
  provider: github
  owner: livecodetech
  repo: ClearVoiceStudio
  releaseType: release

# Linux
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  executableName: clearvoice-studio
  maintainer: "LiveCodeTech <dev@livecodetech.local>"
  syncDesktopName: true
  icon: build-resources/icon.png

# macOS
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.utilities
  icon: build-resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false

# Windows
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
